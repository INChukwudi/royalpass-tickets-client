<div class="login-page"><div class="login-form-panel" style="max-width:none"><div class="login-card">
 <div class="mobile-brand" style="display:flex"><div class="mobile-brand__icon"><span class="material-icons">lock_reset</span></div><div class="mobile-brand__name">RoyalPass</div></div>
 @if(complete()){<div class="login-card__header"><h1 class="login-card__title">Password reset</h1><p class="login-card__sub">Your password has been changed and any previous sessions have been signed out.</p></div><button class="lform__submit" routerLink="/admin/login">Sign in</button>}
 @else{<div class="login-card__header"><h1 class="login-card__title">Choose a new password</h1><p class="login-card__sub">Use at least 10 characters, including uppercase, lowercase and a number.</p></div><form class="lform" [formGroup]="form" (ngSubmit)="submit()"><div class="lform__field"><label class="lform__label">New password</label><div class="lform__input-wrap"><span class="material-icons lform__icon">lock</span><input class="lform__input" type="password" formControlName="password" autocomplete="new-password"></div></div><div class="lform__field"><label class="lform__label">Confirm password</label><div class="lform__input-wrap"><span class="material-icons lform__icon">lock</span><input class="lform__input" type="password" formControlName="confirm" autocomplete="new-password"></div></div>@if(error()){<span class="lform__error">{{error()}}</span>}<button class="lform__submit" [disabled]="form.invalid||loading()">{{loading()?'Saving…':'Reset password'}}</button></form>}
</div></div></div>
