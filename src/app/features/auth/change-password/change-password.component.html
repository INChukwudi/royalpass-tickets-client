<section class="password-page"><div class="card"><span class="material-icons icon">password</span><h1>Change password</h1><p>Changing your password signs out every current RoyalPass session.</p><form [formGroup]="form" (ngSubmit)="submit()"><label>Current password<input type="password" formControlName="currentPassword" autocomplete="current-password"></label><label>New password<input type="password" formControlName="newPassword" autocomplete="new-password"><small>At least 10 characters with uppercase, lowercase and a number.</small></label><label>Confirm new password<input type="password" formControlName="confirm" autocomplete="new-password"></label><button [disabled]="form.invalid||loading()">{{loading()?'Changing…':'Change password'}}</button></form></div></section>
