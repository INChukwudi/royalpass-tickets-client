<main class="join-page"><section class="join-card"><div class="logo"><span class="material-icons">sports_esports</span></div><span class="eyebrow">RoyalPass Games</span><h1>Join the live game</h1><p>Enter the PIN shown on the host screen, then select your assigned seat.</p><form (ngSubmit)="lobby()?join():find()"><label>Game PIN<input name="pin" [(ngModel)]="pin" inputmode="numeric" maxlength="6" placeholder="000000" [disabled]="!!lobby()"></label>@if(lobby();as game){<div class="game-name"><small>{{game.eventTitle}}</small><strong>{{game.gameTitle}}</strong></div><label>Your seat<select name="seat" [(ngModel)]="seatId" required><option value="">Choose your seat</option>@for(seat of game.seats;track seat.seatId){<option [value]="seat.seatId" [disabled]="seat.occupied">{{seat.label}}{{seat.occupied?' — already joined':''}}</option>}</select></label><button type="submit" [disabled]="!seatId||joining()||game.joiningLocked">{{joining()?'Joining...':game.joiningLocked?'Joining closed':'Join game'}}</button><button class="link" type="button" (click)="lobby.set(null);seatId=''">Use another PIN</button>}@else{<button type="submit" [disabled]="loading()">{{loading()?'Finding game...':'Continue'}}</button>}@if(error()){<div class="error" role="alert">{{error()}}</div>}</form></section></main>
