<div class="reports-page"><h1>Reports</h1><p>Download current operational data as Excel workbooks.</p><div class="report-grid">@for(report of reports;track report[0]){<button (click)="download(report[0])" [disabled]="loading()===report[0]"><mat-icon>download</mat-icon><strong>{{report[1]}}</strong><span>{{loading()===report[0]?'Preparing…':'Download Excel'}}</span></button>}</div></div>
