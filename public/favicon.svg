<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a35"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d080"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Gold ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <!-- Music note -->
  <!-- Note head (filled ellipse) -->
  <ellipse cx="25" cy="44" rx="7" ry="5" fill="url(#gold)" transform="rotate(-15 25 44)"/>
  <!-- Note stem -->
  <rect x="31.5" y="17" width="3" height="27" fill="url(#gold)" rx="1.5"/>
  <!-- Note flag / beam -->
  <path d="M34.5 17 Q50 22 44 33 Q40 28 34.5 28 Z" fill="url(#gold)"/>
</svg>